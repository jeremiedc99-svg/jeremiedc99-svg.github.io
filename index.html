.pl .old{font-size:14px}.pl b{font-size:20px;color:#2B807E}.pl .pp{margin-top:0;padding:6px 14px}.pl .new{font-size:18px}
/* Cartes de paniers : chaque information reste sur sa ligne, au même endroit */
.card h3,.cpi b,.lcb b,.bd h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card[data-a=shop] .mu,.sm2,.sm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcb>div:first-child{min-width:0}.row>h3{min-width:0}
.cdp2{position:absolute;top:72px;right:12px;z-index:2;background:rgba(29,29,29,.68);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px;white-space:nowrap}
/* Cartes de paniers : fond blanc, contour teal */
.card[data-a=shop]{background:#fff;color:#1D1D1D;--tx:#1D1D1D;--mu:#6B6B6B;border:2px solid #389C9A;box-shadow:0 4px 14px rgba(56,156,154,.12)}
.card[data-a=shop] .old{color:#8A8A8A}
.card[data-a=shop] .logo{border-color:#fff}
/* Effet 3D minimaliste sur les cartes de paniers : tranche pleine en bas + ombre douce, la carte s'enfonce au toucher */
.card[data-a=shop]{--edge:#2B807E}.cp2{--edge:#CFE4E3}.mc{--edge:#DADADA}.mc.sel{--edge:#E3BE45}.lc{--edge:#1F5F5D}
.card[data-a=shop],.cp2,.mc,.lc{box-shadow:0 4px 0 var(--edge),0 12px 20px rgba(29,29,29,.08);transition:transform .15s,box-shadow .15s}
@media(hover:hover){.card[data-a=shop]:hover,.cp2:hover,.mc:hover,.lc:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--edge),0 14px 22px rgba(29,29,29,.1)}}
.card[data-a=shop]:active,.cp2:active,.mc:active,.lc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge),0 3px 8px rgba(29,29,29,.08)}
.hs:has(.card),.hs:has(.lc){padding-bottom:18px}
/* Icônes (remplacent les emojis) aux couleurs de l'appli */
.ei{display:inline-block;width:1em;height:1em;vertical-align:-.14em;flex:none}
h2 .ei{color:#2B807E}
.ban,.logo,.lct,.mpin{color:#fff}.mpin.sel{color:#1D1D1D}.tile{color:#2B807E}.ob .em,.empty b{color:#389C9A}.bg i{color:#2B807E}
[data-a=fav]{color:#389C9A}
[data-cd]::before{content:"";display:inline-block;width:.95em;height:.95em;margin-right:.3em;vertical-align:-.12em;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%272.4%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2713%27%20r%3D%278%27/%3E%3Cpath%20d%3D%27M12%209v4l2.5%202M9.5%202.5h5%27/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%272.4%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2713%27%20r%3D%278%27/%3E%3Cpath%20d%3D%27M12%209v4l2.5%202M9.5%202.5h5%27/%3E%3C/svg%3E") center/contain no-repeat}
/* Commandes : même style que les paniers de l'accueil (fond blanc, contour teal, relief) */
.card.oc{background:#fff;color:#1D1D1D;--tx:#1D1D1D;--mu:#6B6B6B;--edge:#2B807E;border:2px solid #389C9A;box-shadow:0 4px 0 var(--edge),0 12px 20px rgba(29,29,29,.08)}
.card.oc .old{color:#8A8A8A}.card.oc .logo{border-color:#fff}.card.oc .btn.dng{color:#C0392B;border-color:#C0392B}
.card.oc [data-a=rate]{color:#E0A100}
.sso{display:flex;align-items:center;gap:18px;width:100%;min-height:58px;border-radius:14px;padding:0 20px;font-size:16px;font-weight:700;margin-top:14px;box-shadow:0 3px 8px rgba(29,29,29,.18);text-align:left}
.sso svg{width:26px;height:26px;flex:none}.sso.g{background:#fff;color:#6B6B6B;border:1px solid #E8E8E8}.sso.f{background:#3B5998;color:#fff}.sso.e{background:#389C9A;color:#fff}
.sso:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(29,29,29,.18)}
/* Toutes les vignettes (cartes) : fond blanc, contour teal, relief - même style que les paniers de l'accueil */
.card{background:#fff;color:#1D1D1D;--tx:#1D1D1D;--mu:#6B6B6B;--edge:#2B807E;border:2px solid #389C9A;box-shadow:0 4px 0 var(--edge),0 12px 20px rgba(29,29,29,.08)}
.card .old{color:#8A8A8A}.card .logo{border-color:#fff}
.card .btn{background:var(--g);color:#fff}.card .btn.dng{background:none;color:#C0392B;border-color:#C0392B}
.card .tag{background:#E3F3F2;color:#1D1D1D}

.sfr{position:absolute;inset:18%;border:3px solid #FEDB71;border-radius:20px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
/* Boutons : même taille de texte partout, le bouton s'allonge si le texte est long */
.btn,.chip,.tl,.sso span{white-space:nowrap}
.btn{font-size:16px;padding-left:24px;padding-right:24px}
.chip,.chip.cp{font-size:14px;padding-left:16px;padding-right:16px}
.tl{font-size:14px}
.bar.row .btn{flex:1 0 auto!important}
/* Étoiles aux couleurs de l'appli */
.st{flex:none;overflow:visible}.st path{stroke-width:1.6;stroke-linejoin:round}
.st .sr{fill:#2B807E;stroke:#2B807E}.st .sl{fill:#389C9A;stroke:#389C9A}
.st:not(.on) .sr{fill:#E3F3F2;stroke:#B5D9D8}.st:not(.on) .sl{fill:#fff;stroke:#B5D9D8}
.stars{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}.mu .st,.sm2 .st,.sm .st{vertical-align:-2px}
.rvst{display:flex;gap:4px;margin:6px 0 16px}.rvst button{min-height:44px;padding:0 3px}
textarea{font:inherit;color:#1D1D1D;background:#F8F8F8;border:1.5px solid #E4E4E4;border-radius:16px;padding:12px;width:100%;resize:none}textarea:focus{outline:3px solid rgba(56,156,154,.3);border-color:#389C9A}
/* Langue */
.lang{display:inline-flex;background:rgba(255,255,255,.2);border-radius:99px;padding:3px;gap:2px}
.lang button{min-height:32px;padding:0 14px;border-radius:99px;font-weight:800;font-size:13px;color:#fff;background:transparent}
.lang button.on{background:#fff;color:#2B807E}
.lang.lt{background:#F8F8F8;border:1.5px solid #E4E4E4}.lang.lt button{color:#6B6B6B}.lang.lt button.on{background:#389C9A;color:#fff}
.langrow{margin-top:14px;gap:10px;justify-content:flex-start}.langrow b{font-size:14px}
.langtop{position:absolute;top:14px;right:14px;z-index:3}
.lrow{border-bottom:1px solid #F0F0F0}.lrow:last-child{border-bottom:0}.lrow .ei{color:#389C9A;width:22px;height:22px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
