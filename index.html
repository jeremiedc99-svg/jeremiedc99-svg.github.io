<script>

return`<p>Vous êtes restaurateur ou commerçant ? Proposez vos invendus en paniers surprise.</p><label class="lbl" for="me">E-mail professionnel</label><input id="me" type="email" value="${esc(db.user.email)}"><div class="err" id="er" role="alert"></div><button class="btn full" data-a="mreq" style="margin-top:10px">Demander l’autorisation</button>`}

function Dd(){const r=db.prefs.radius,vg=db.prefs.diets.includes('Végétarien');
let L=S.filter(s=>s.d<=r&&(!vg||s.v));
return`<div class="hero"><div class="mu">📍 Votre position</div><h1>Bonjour ${esc(db.user.name)} 👋</h1><p style="opacity:.9">Sauvez un panier surprise, régalez-vous 🌿</p>
